[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sofia-utils"
version = "1.0.0"
description = "A utilities package named after my beautiful siamese cat"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "Luis Ignacio Reyes Castro", email = "luis.i.reyes.castro@gmail.com" },
]
dependencies = [
  "Pillow>=12.1.1",
  "pydantic>=2.12.5",
  "tiktoken>=0.9.0",
]
[project.optional-dependencies]
psycopg = [
  "psycopg[binary]>=3.3.3",
  "psycopg_pool>=3.3.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sofia_utils*"]
